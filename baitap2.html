
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 02 - Form đăng ký</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>FORM ĐĂNG KÝ NGƯỜI DÙNG</h1>
            <nav>
                <a href="index.html">Trang chủ</a>
                <a href="baitap01.html">Lý thuyết</a>
                <a href="baitap02.html">Đăng ký</a>
                <a href="baitap03.html">Đếm ngược</a>
                <a href="baitap22.html">Bài tập 22</a>
                <a href="baitap23.html">Bài tập 23</a>
                <a href="diemdanh.html">Điểm danh</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card form-container">
            <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
            <p>Vui lòng điền đầy đủ thông tin bên dưới.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Nhập họ và tên"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ít nhất 8 ký tự"
                        required
                    >
                    <small>
                        Mật khẩu cần có chữ hoa, chữ thường và chữ số.
                    </small>
                </div>

                <div class="form-group">
                    <label>
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >
                        Tôi đồng ý với điều khoản sử dụng.
                    </label>
                </div>

                <button type="submit" class="button">
                    Đăng ký
                </button>

                <button type="reset" class="button">
                    Làm mới
                </button>

                <p id="formMessage" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 - Bài tập Lập trình Web</p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
